info:
  title: StayGrid API
  description: The core backend API for the StayGrid monorepo.
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateCustomerDto:
      type: object
      properties:
        email:
          type: string
          example: john.doe@example.com
        password:
          type: string
          example: securePassword123
        name:
          type: string
          example: John Doe
        phone:
          type: string
          example: "+1234567890"
        gender:
          type: string
          example: Male
        age:
          type: number
          example: 30
      required:
        - email
        - password
        - name
        - phone
    CreateOwnerDto:
      type: object
      properties:
        email:
          type: string
          example: owner1@staygrid.com
          description: The email for the new Farmhouse Owner
        password:
          type: string
          example: securePassword123
          description: Temporary password for the owner
        name:
          type: string
          example: John Owner
        phone:
          type: string
          example: "+1234567890"
      required:
        - email
        - password
    CreateFarmhouseDto:
      type: object
      properties:
        title:
          type: string
        price12Hours:
          type: number
        price24Hours:
          type: number
        capacity:
          type: number
        maxIncludedGuests:
          type: number
        extraGuestFee:
          type: number
        photos:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        isFeatured:
          type: boolean
        isCoupleFriendly:
          type: boolean
        isPetFriendly:
          type: boolean
        isBestMatch:
          type: boolean
        isTrusted:
          type: boolean
        streetAddress:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        contactNumbers:
          type: array
          items:
            type: string
        tokenAmount:
          type: number
        isWheelchairAccessible:
          type: boolean
        hasPool:
          type: boolean
        poolType:
          type: string
        poolSize:
          type: string
        babyPoolSize:
          type: string
        hasTurf:
          type: boolean
        hasRainDance:
          type: boolean
        hasPlayArea:
          type: boolean
        hasGardenArea:
          type: boolean
        hasGazebo:
          type: boolean
        hasCelebrationArea:
          type: boolean
        roomCount:
          type: number
        acRoomCount:
          type: number
        nonAcRoomCount:
          type: number
        hallCount:
          type: number
        singleBedCount:
          type: number
        doubleBedCount:
          type: number
        extraMattressCount:
          type: number
        balconyCount:
          type: number
        hasKitchen:
          type: boolean
        hasFridge:
          type: boolean
        hasRoWater:
          type: boolean
        hasBbq:
          type: boolean
        hasGas:
          type: boolean
        gasCharge:
          type: number
        hasCarom:
          type: boolean
        hasUno:
          type: boolean
        hasTeenPatti:
          type: boolean
        hasChess:
          type: boolean
        has8BallPool:
          type: boolean
        hasTv:
          type: boolean
        hasSpeakers:
          type: boolean
        hasMicrophone:
          type: boolean
        hasWifi:
          type: boolean
        ownerId:
          type: string
      required:
        - title
        - price12Hours
        - price24Hours
        - capacity
    CreateBookingDto:
      type: object
      properties:
        checkIn:
          type: string
          example: 2026-08-01
          description: Check-in date
        checkOut:
          type: string
          example: 2026-08-03
          description: Check-out date
        adults:
          type: number
          example: 2
          description: Number of adults
        children:
          type: number
          example: 0
          description: Number of children
        farmhouseId:
          type: string
          example: farmhouse-uuid
          description: ID of the farmhouse
        notes:
          type: string
          example: Late check-in expected
          description: Additional notes or requests
      required:
        - checkIn
        - checkOut
        - adults
        - children
        - farmhouseId
    VerifyPaymentDto:
      type: object
      properties:
        razorpayPaymentId:
          type: string
          description: Razorpay Payment ID
        razorpayOrderId:
          type: string
          description: Razorpay Order ID
        razorpaySignature:
          type: string
          description: Razorpay Signature
      required:
        - razorpayPaymentId
        - razorpayOrderId
        - razorpaySignature
    CreateCategoryDto:
      type: object
      properties: {}
    UpdateCategoryDto:
      type: object
      properties: {}
    CreateHeroBannerDto:
      type: object
      properties: {}
    UpdateHeroBannerDto:
      type: object
      properties: {}
    CreateReviewDto:
      type: object
      properties: {}
    UpdateReviewDto:
      type: object
      properties: {}
